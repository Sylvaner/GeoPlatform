[workspace]
members = ["engine"]
default-members = [".", "engine"]
resolver = "3"

[workspace.package]
rust-version = "1.88"

[package]
name = "geo-platform"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
default-run = "geo-server"

[lib]
name = "geo_platform"
path = "src/lib.rs"

[[bin]]
name = "geo-server"
path = "src/bin/geo-server.rs"

[[bin]]
name = "geo-data"
path = "src/bin/geo-data.rs"

[[bin]]
name = "geo-export"
path = "src/bin/geo-export.rs"

[[bin]]
name = "geo-stl"
path = "src/bin/geo-stl.rs"

[[bin]]
name = "geo-stl-layers"
path = "src/bin/geo-stl-layers.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
geo-engine = { path = "engine" }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.laz]
opt-level = 3

[profile.dev.package.las]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
copc-reader = { path = "engine/vendor/copc-reader" }

