[vectors]
# Utiliser aussi les pages valides de caches interrompus ou couvrant seulement une partie de la zone.
allow_partial_cache = true
# "skip" ignore un cache vectoriel absent avec un message ; "error" arrête l'export.
missing_layers = "skip"

# Nombre maximal d'objets source dans une couche ; dépassement signalé comme erreur.
max_objects_per_layer = 100000

# Distance maximale entre échantillons d'une ligne ou d'une chaussée sur le terrain, en mètres.
line_sample_step_m = 10

# Limite de sommets de la chaussée fusionnée ; augmenter seulement si la mémoire le permet.
max_road_vertices = 2000000

# Champs BD TOPO essayés dans cet ordre pour la hauteur ; sinon hauteur de secours de la couche.
building_height_fields = ["hauteur","hauteur_mediane","height"]

# Millésime du cache BD TOPAGE à lire, sous BD_TOPAGE/<millésime>.
topage_edition = "2026"

[vegetation]
# Classes LAS utilisées comme végétation ; 3, 4 et 5 représentent les végétations basse, moyenne et haute.
classes = [3,4,5]

# Taille des cellules de canopée en mètres ; un volume simple par cellule, pas un inventaire d'arbres.
cell_size_m = 12

# Hauteur minimale en mètres d'un volume de végétation au-dessus du terrain.
min_height_m = 3

# Hauteur maximale en mètres ; filtre les points de végétation aberrants.
max_height_m = 45

# Nombre maximal de volumes de végétation ; répartis sur toute la zone.
max_trees = 2500

# Rayon du houppier rapporté à la hauteur de l'arbre.
crown_radius_ratio = 0.24

# Rayon du tronc rapporté à la hauteur de l'arbre.
trunk_radius_ratio = 0.022

# Détail de la sphère de feuillage : 1 est léger ; maximum 3.
canopy_subdivisions = 1

# Graine fixe pour rendre les variations et l'échantillonnage reproductibles.
seed = 42

# Couleur de base du feuillage [rouge, vert, bleu, opacité], entre 0 et 1.
foliage_color = [0.12,0.28,0.065,1]

# Couleur de base de l'écorce [rouge, vert, bleu, opacité], entre 0 et 1.
bark_color = [0.2,0.12,0.06,1]

# Amplitude des variations de couleur du feuillage et de l'écorce, sans image externe.
procedural_variation = 0.22

[lidar]
# Nombre maximal de points de l'aperçu LiDAR ; indépendant des mesures utilisées pour le terrain et les toits.
max_display_points = 10000

# Taille en mètres des petits repères représentant les points LiDAR.
display_point_size_m = 0.2

# Prendre un candidat d'aperçu tous les N points, puis limiter par échantillonnage réparti.
display_stride = 200

[camera]
# Caméra "orthographic" pour une vue sans perspective, ou "perspective".
projection = "orthographic"

# Direction de la caméra en degrés autour du terrain.
azimuth_deg = 225

# Hauteur angulaire de la caméra en degrés : entre 0 exclu et 90 inclus.
elevation_deg = 55

# Marge de cadrage autour du terrain ; 1.18 laisse 18 % de marge.
framing_margin = 1.18

# Focale en millimètres en mode perspective ; ignorée en mode orthographique.
focal_length_mm = 45

# Distance maximale visible par la caméra, en mètres.
clip_end_m = 10000

[water]
# Garde minimale au-dessus du terrain et de l'orthophoto, en mètres de scène.
# La découpe suit le relief : cette garde ne compense pas de grands triangles traversants.
surface_clearance_m = 0.15

# Épaisseur graphique ajoutée vers le bas, sans déplacer la surface ni inventer une profondeur réelle.
thickness_m = 1.0

# Limite de sommets par objet d'eau, pour éviter une découpe démesurée.
max_vertices = 2000000

[view]
# Distance d'affichage de la vue 3D, en mètres ; indépendante du clip end de la caméra.
clip_end_m = 10000

# Replier les collections en mode View Layer ; finalisation dans une fenêtre masquée sous Windows.
collapse_outliner = true

# Délai maximal de cette finalisation, en secondes ; nécessite une session graphique.
# Sur un serveur sans affichage, mettre collapse_outliner = false pour exporter sans cette étape.
outliner_timeout_seconds = 180

# Conserver le terrain mais le masquer si la couche orthophoto est activée et présente.
hide_terrain_with_orthophoto = true

[lighting]
# Direction horizontale du soleil en degrés.
sun_azimuth_deg = 135

# Hauteur du soleil au-dessus de l'horizon en degrés.
sun_elevation_deg = 45

# Intensité de la lumière solaire Blender.
sun_energy = 3

# Taille angulaire du soleil en degrés ; augmente la douceur des ombres.
sun_angle_deg = 4

# Intensité de la lumière ambiante du ciel.
sky_strength = 0.35

# Couleur du ciel [rouge, vert, bleu, opacité], entre 0 et 1.
sky_color = [0.62,0.77,1,1]

[render]
# Moteur "BLENDER_EEVEE" léger, ou "CYCLES" pour un rendu plus coûteux.
engine = "BLENDER_EEVEE"

# Largeur en pixels du rendu ; ne modifie pas les JPEG intégrés.
resolution_x = 1600

# Hauteur en pixels du rendu ; ne modifie pas les JPEG intégrés.
resolution_y = 1200

# Nombre d'échantillons de rendu ; augmenter pour réduire le bruit.
samples = 32

# Créer aussi une image PNG après l'enregistrement du .blend.
preview = false

# Chemin du PNG d'aperçu ; utilisé seulement si preview = true.
preview_file = "exports/scene.png"

# Fond transparent dans l'image rendue.
transparent_background = false

[blender]
# "auto" recherche Blender installé ; sinon indiquer le chemin complet de blender.exe.
executable = "auto"

# Compresser le conteneur .blend sans redimensionner ni recompresser les JPEG sources.
compress_file = true

# Nombre de threads du processus Blender.
threads = 4

[buildings]
# "auto" retient un toit LiDAR assez documenté, sinon BD TOPO ; "bd_topo" l'impose ; "lidar" exige les seuils LiDAR.
source = "auto"

# Plaquer les JPEG BD ORTHO sur les toits. Les façades n'ont pas de photo exploitable dans une orthophoto.
texture_roofs = true

# Garder les Z de toit BD TOPO s'ils existent et sont cohérents, plutôt qu'une extrusion plate.
use_bd_topo_altitudes = true

# Taille en mètres des cellules de toit LiDAR ; 1 garde des détails plus fins que le terrain.
cell_size_m = 1

# Nombre minimal de points LAS de classe 6 pour accepter un toit LiDAR.
min_points = 12

# Part minimale des cellules du contour couvertes par des mesures valides, entre 0 et 1.
min_coverage = 0.7

# Densité minimale de points bâtiment par mètre carré pour préférer le toit LiDAR.
min_density_per_m2 = 2

# Hauteur minimale du toit au-dessus du terrain, en mètres ; rejette des points sol mal classés.
min_height_m = 2

# Hauteur maximale du toit au-dessus du terrain, en mètres ; rejette les valeurs aberrantes.
max_height_m = 150

# Écart maximal entre altitudes d'une cellule LiDAR, en mètres ; rejette les cellules incohérentes.
max_cell_spread_m = 5

# Distance maximale, en cellules de toit, pour interpoler entre mesures voisines ; pas de grand trou inventé.
fill_radius_cells = 3

# Limite des cellules LiDAR de bâtiment conservées pour toute la scène ; dépassement = erreur.
max_cells = 2000000

# Limite des cellules testées pour un bâtiment ; dépassement = erreur.
max_cells_per_building = 100000


