# Contexte : export hors ligne des données du cache vers une scène Blender autonome.
# Usage : cargo run --bin geo-export -- --config export.toml
# Chaque paramètre a sa valeur par défaut dans export.default.toml.
# Une couche vide n'est jamais créée, même si enabled = true.

# Version du format de configuration ; conserver 1.
schema_version = 1

[area]
# Centre de la zone : [latitude, longitude] avec crs = "latlon" ; sinon [x, y].
center = [48.26183052164179,4.738721628572549]

# Repère du centre : "latlon" ou code EPSG, par exemple "EPSG:2154".
crs = "latlon"

# Longueur du côté du carré à exporter, en mètres ; doit être couvert par le cache.
side_m = 3000

[paths]
# Dossier contenant RGE_ALTI, BD_ORTHO, BD_TOPO, LIDAR_HD, etc.
# Relatif à ce TOML, ou absolu sur un autre disque / partage réseau.
# Sous Windows, utiliser des apostrophes : 'D:\Geo\cache' ou '\\nas\partage\cache'.
cache_root = "."

# Fichier Blender final, relatif au TOML ou absolu ; peut être sur un autre disque.
# Le dossier est créé si nécessaire. Exemple réseau : '\\nas\partage\scene.blend'.
output_file = "exports/scene.blend"

# Dossier des préparations temporaires, relatif au TOML ou absolu.
# Peut rester sur un disque local même si le cache et le résultat sont sur le réseau.
# Aucun fichier source du cache n'y est déplacé. Exemple : 'C:\Geo\travail'.
work_directory = "exports/.work"

# Conserver le sous-dossier de travail après réussite, pour examiner le plan intermédiaire.
keep_work_files = false

# Autoriser le remplacement du .blend et de l'aperçu existants.
overwrite = false

# Préparer les données sans lancer Blender ; conserve le plan pour diagnostic.
prepare_only = false

[terrain]
# "auto" : ALTI, puis LiDAR sol pour les manques ; "alti" ou "lidar" impose une source.
source = "auto"

# Espacement visé entre sommets du terrain, en mètres. Ne réduit pas les images.
grid_step_m = 10

# Limite du nombre de sommets du terrain ; une scène trop dense produit une erreur explicite.
max_vertices = 250000

# Multiplicateur vertical : 1 respecte les hauteurs réelles, 2 accentue le relief.
vertical_exaggeration = 1

# "min" recentre les altitudes près de zéro ; "absolute" conserve leur valeur Lambert-93.
altitude_origin = "min"

# Altitude minimale admissible en mètres ; élimine les valeurs sans données.
valid_altitude_min_m = -500

# Altitude maximale admissible en mètres ; élimine les valeurs aberrantes.
valid_altitude_max_m = 9000

# Classe LAS des points sol ; 2 correspond au sol dans le LiDAR IGN.
lidar_ground_class = 2

# Rayon maximal, en cellules de terrain, pour combler un manque à partir de voisins mesurés.
lidar_fill_radius_cells = 3

[ortho]
# Limite de sécurité du nombre de JPEG natifs intégrés ; erreur plutôt que réduction silencieuse.
max_tiles = 20000

# Nombre de tuiles décodées simultanément pour lire les altitudes ; ne change pas leur définition.
max_loaded_tiles = 64

# Filtrage d'affichage : "nearest" conserve les pixels nets, "bilinear" adoucit. Les JPEG restent inchangés.
interpolation = "nearest"

[layers]
[layers.terrain]
# Inclure cette couche si elle contient des éléments ; false l'exclut complètement du fichier.
enabled = true

# Afficher cette couche à l'ouverture et au rendu ; false la conserve mais la masque.
visible = true

# Couleur simple [rouge, vert, bleu, opacité], chaque valeur entre 0 et 1.
color = [0.36,0.31,0.2,1]

# Largeur en mètres des lignes ; pour les routes, largeur de la chaussée fusionnée.
line_width_m = 1

# Décalage vertical en mètres pour limiter la superposition de surfaces au même niveau.
z_offset_m = 0

# Hauteur de secours en mètres si la source ne donne pas de hauteur exploitable.
fallback_height_m = 3

[layers.orthophoto]
# Inclure cette couche si elle contient des éléments ; false l'exclut complètement du fichier.
enabled = true

# Afficher cette couche à l'ouverture et au rendu ; false la conserve mais la masque.
