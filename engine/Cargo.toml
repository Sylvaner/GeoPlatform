[package]
name = "geo-engine"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
autobins = false

[lib]
name = "geo_engine"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
proj4rs = { version = "0.2", features = ["crs-definitions"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "deflate", "gzip"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
las = { version = "0.9", features = ["laz"] }
copc-reader = "0.9"
copc-core = "0.9"
geo = { version = "0.33", default-features = false, features = ["earcutr"] }

